// ---------- Render ----------
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';

  const header = document.createElement('div');
  header.innerHTML = `<h1>NA Bev Variance Tracker</h1><div class="sub">Weekly purchased-vs-accounted-for reconciliation, per item, per store.</div>`;
  app.appendChild(header);

  // Top-level tabs: stores + compare + settings
  const tabbar = document.createElement('div');
  tabbar.className = 'tabbar';
  Object.keys(state.stores).forEach(key=>{
    const b = document.createElement('button');
    b.className = 'tab' + (state.activeView==='store' && state.activeStore===key ? ' active':'');
    // Tab label describes the view's function (matching Order Guide/Compare Periods/Settings)
    // rather than the store's name — with a single store, the name no longer distinguishes
    // anything, and it never told you what was on the tab anyway. The store's actual name is
    // untouched everywhere else (Order Guide header, email subject, Compare Periods).
    b.textContent = 'Sales vs Purchasing';
    wireClick(b, ()=>{ state.activeStore=key; state.activeView='store'; save(); render(); });
    tabbar.appendChild(b);
  });
  const orderBtn = document.createElement('button');
  orderBtn.className = 'tab' + (state.activeView==='order' ? ' active':'');
  orderBtn.textContent = '📦 Order Guide';
  wireClick(orderBtn, ()=>{ state.activeView='order'; save(); render(); });
  tabbar.appendChild(orderBtn);

  const compareBtn = document.createElement('button');
  compareBtn.className = 'tab' + (state.activeView==='compare' ? ' active':'');
  compareBtn.textContent = '⇄ Compare Periods';
  wireClick(compareBtn, ()=>{ state.activeView='compare'; save(); render(); });
  tabbar.appendChild(compareBtn);

  const settingsBtn = document.createElement('button');
  settingsBtn.className = 'tab' + (state.activeView==='settings' ? ' active':'');
  settingsBtn.textContent = '⚙ Settings';
  wireClick(settingsBtn, ()=>{ state.activeView='settings'; save(); render(); });
  tabbar.appendChild(settingsBtn);

  app.appendChild(tabbar);

  if(state.activeView==='compare'){ renderCompare(app); return; }
  if(state.activeView==='settings'){ renderSettings(app); return; }
  if(state.activeView==='order'){ renderOrderGuide(app); return; }
  renderStoreView(app);
}

function renderStoreView(app){
  const store = getActiveStore();
  if(store.items.length===0){
    const card = document.createElement('div');
    card.className='card empty-state';
    card.innerHTML = `<div>No items configured for <strong>${store.name}</strong> yet.</div>
      <button class="btn" id="goSettings">Set up items in Settings</button>`;
    app.appendChild(card);
    wireClick(card.querySelector('#goSettings'), ()=>{ state.activeView='settings'; save(); render(); });
    return;
  }
  ensureActivePeriod(store);
  const period = store.periods[store._activePeriodIdx];

  // Period bar
  const pcard = document.createElement('div');
  pcard.className = 'card';
  pcard.innerHTML = `<div class="rowflex">
    <div>
      <h3 style="margin-bottom:4px">Period</h3>
      <div class="rowflex" style="gap:8px">
        <select id="periodSelect"></select>
        <input type="text" class="wide" id="periodName" value="${period.name}" placeholder="Period name">
        <input type="text" style="width:120px" id="periodStart" value="${period.startDate}" placeholder="Start date">
      </div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn secondary small" id="newPeriodBtn">+ New Period</button>
    </div>
  </div>`;
  app.appendChild(pcard);

  const periodSelect = pcard.querySelector('#periodSelect');
  store.periods.forEach((p,i)=>{
    const o=document.createElement('option'); o.value=i; o.textContent=p.name; if(i===store._activePeriodIdx) o.selected=true;
    periodSelect.appendChild(o);
  });
  periodSelect.onchange = ()=>{ store._activePeriodIdx = parseInt(periodSelect.value); store._activeWeekIdx=0; save(); render(); };
  pcard.querySelector('#periodName').oninput = (e)=>{ period.name = e.target.value; save(); };
  pcard.querySelector('#periodStart').oninput = (e)=>{ period.startDate = e.target.value; save(); };
  wireClick(pcard.querySelector('#newPeriodBtn'), ()=>{
    const carry = {};
    // expectedOnHand returns a servings-equivalent number; beginInv is a native-unit field
    // (gallons for Lemonade, per the "(gal)" input label), so it needs converting back or a
    // gallon item's next period starts over 21x too high (128oz/gal ÷ 6oz pour).
    // Order-only items (Passport coffee/tea) never participate in this reconciliation flow at
    // all — but a purchase CSV can still incidentally match one of them (e.g. a broader
    // MarginEdge report with a "Coffee, Whole Bean" line), leaving a stray non-zero purchased
    // value sitting on some week. Carrying that through expectedOnHand would produce a
    // meaningless computed "beginning inventory" for an item that was never actually tracked —
    // so these are skipped here rather than carried forward.
    store.items.filter(it=>!it.orderOnly).forEach(it=>{ carry[it.id] = servingsToNative(it, expectedOnHand(store, period, it, 3)); });
    const np = newPeriod(store.items, 'Period ' + (store.periods.length+1), '');
    np.beginInv = carry;
    store.periods.push(np);
    store._activePeriodIdx = store.periods.length-1;
    store._activeWeekIdx = 0;
    save(); render();
  });

  // Beginning inventory row (period-level, optional)
  const invCard = document.createElement('div');
  invCard.className = 'card';
  invCard.innerHTML = `<h3>Beginning on-hand (optional — enables count reconciliation)</h3>`;
  const invRow = document.createElement('div');
  invRow.style.display='flex'; invRow.style.gap='14px'; invRow.style.flexWrap='wrap';
  // Order-only items (Passport coffee/tea) don't participate in variance reconciliation at all —
  // showing them here would imply they're tracked when they're not.
  store.items.filter(it=>!it.orderOnly).forEach(it=>{
    const f = document.createElement('div'); f.className='settings-field';
    f.innerHTML = `<label>${it.name} (${it.unit==='gallon'?'gal':'units'})</label>`;
    const inp = document.createElement('input'); inp.type='text'; inp.value = period.beginInv[it.id] ?? '';
    inp.oninput = (e)=>{ period.beginInv[it.id] = e.target.value; save(); };
    f.appendChild(inp);
    invRow.appendChild(f);
  });
  invCard.appendChild(invRow);
  app.appendChild(invCard);

  // Ending on-hand — NOT a separate field. This reads/writes the exact same data as Week 4's
  // Count column (period.weeks[3][item.id].actualCount); it's surfaced here as its own card so
  // the period's close-out count is visible without switching to the Week 4 tab, and easy to
  // fix if something was missed. There's only one number underneath either way — editing it
  // here or editing it inline on Week 4 both write to the same place, so they can never drift
  // out of sync with each other.
  const endCard = document.createElement('div');
  endCard.className = 'card';
  endCard.innerHTML = `<h3>Ending on-hand (optional — this period's close-out count, same field as Week 4's Count column)</h3>`;
  const endRow = document.createElement('div');
  endRow.style.display='flex'; endRow.style.gap='14px'; endRow.style.flexWrap='wrap';
  const lastWeekData = period.weeks[3];
  store.items.filter(it=>!it.orderOnly).forEach(it=>{
    const f = document.createElement('div'); f.className='settings-field';
    f.innerHTML = `<label>${it.name} (${it.unit==='gallon'?'gal':'units'})</label>`;
    const inp = document.createElement('input'); inp.type='text'; inp.value = lastWeekData[it.id].actualCount ?? '';
    inp.addEventListener('change', (e)=>{ lastWeekData[it.id].actualCount = e.target.value; save(); render(); });
    f.appendChild(inp);
    endRow.appendChild(f);
  });
  endCard.appendChild(endRow);
  app.appendChild(endCard);

  // Week tabs
  const wcard = document.createElement('div');
  wcard.className='card';
  const wt = document.createElement('div'); wt.className='weektabs';
  [0,1,2,3].forEach(i=>{
    const b=document.createElement('button');
    b.className='weektab'+(store._activeWeekIdx===i?' active':'');
    b.textContent='Week '+(i+1);
    wireClick(b, ()=>{ store._activeWeekIdx=i; save(); render(); });
    wt.appendChild(b);
  });
  wcard.appendChild(wt);

  const weekIdx = store._activeWeekIdx;
  const weekData = period.weeks[weekIdx];

  const importInput = document.createElement('input');
  importInput.type = 'file';
  importInput.accept = '.csv';
  importInput.id = 'csvFileInput';
  importInput.style.cssText = 'position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;';
  importInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(file) processAnyCsvFile(file, store, weekData, weekIdx);
    importInput.value = '';
  };
  const importLabel = document.createElement('label');
  importLabel.setAttribute('for', 'csvFileInput');
  importLabel.className = 'csv-dropzone';
  importLabel.innerHTML = `<span class="csv-icon">📥</span><span>Drag a <strong>sales</strong> or <strong>purchases</strong> CSV here, or click to import <span class="csv-sub">— Week ${weekIdx+1}, auto-detected</span></span>`;
  wcard.appendChild(importInput);
  wcard.appendChild(importLabel);

  // The whole card is the drop target (not just the small dashed box) so an imprecise drop still
  // lands correctly, and a window-level dragover/drop guard stops the browser's default
  // navigate-to-file behavior if a drop ever lands outside it. processAnyCsvFile sniffs the CSV's
  // header row to tell a Toast sales export apart from a MarginEdge purchase report, so either
  // file type can be dropped on the same zone.
  wcard.addEventListener('dragover', (e)=>{ e.preventDefault(); wcard.classList.add('csv-dragover'); });
  wcard.addEventListener('dragleave', (e)=>{
    if(!wcard.contains(e.relatedTarget)) wcard.classList.remove('csv-dragover');
  });
  wcard.addEventListener('drop', (e)=>{
    e.preventDefault();
    wcard.classList.remove('csv-dragover');
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if(file) processAnyCsvFile(file, store, weekData, weekIdx);
  });

  const table = document.createElement('table');
  table.innerHTML = `<thead>
    <tr>
      <th class="left" rowspan="2">Item</th>
      <th class="group-header this-week" colspan="8">This week</th>
      <th class="group-header running-total" colspan="2">Running total <span class="sub">(since period start)</span></th>
      <th rowspan="2">Count (opt.)</th>
      <th class="left" rowspan="2">Notes</th>
    </tr>
    <tr>
      <th>Purchased</th>
      <th>Sold (all ch.)</th>
      <th>Discount $</th>
      <th>Comped*</th>
      <th>Kitchen use</th>
      <th>Accounted for</th>
      <th title="This week's Accounted for ÷ this week's Purchased. Doesn't include stock carried over from prior weeks — a week with 0 Purchased and some Sold still shows 100%, since there was nothing new to reconcile. Shown as 100%+ when more got sold than was purchased this week — not an error, just means some of what sold came from stock bought before this week.">% of purchases†</th>
      <th>Flag</th>
      <th>Unaccounted</th>
      <th>Unacct. cost</th>
    </tr>
  </thead>`;
  const tbody = document.createElement('tbody');

  let totUnacctCost=0, totPurchU=0, totAccounted=0, totUnacctUnits=0;

  // Order-only items (coffee/tea via Passport) have no sales data and aren't part of NA Bev
  // variance reconciliation — they only appear in the Order Guide.
  store.items.filter(it=>!it.orderOnly).forEach(item=>{
    const carryIn = balanceEnteringWeek(store, period, item, weekIdx);
    const r = computeRow(item, weekData, carryIn);
    totUnacctCost += r.unaccountedCost;
    totPurchU += r.purchU;
    totAccounted += r.accountedFor;
    totUnacctUnits += r.unaccounted;

    const tr = document.createElement('tr');
    const sustained = sustainedRed(period, item.id, weekIdx);
    // Independent of r.flag on purpose — see the threshold's comment in defaultState(). r.flag
    // only ever looks at this week's purchased-vs-sold ratio; this looks at the actual size of
    // the unaccounted pile (in dollars, so it's comparable across items of very different volume/
    // cost), regardless of what this week's ratio says. A week can be green on flow and still
    // trip this if there's a large real surplus sitting unaccounted. Attached to the Unacct. cost
    // cell (the Running total group) rather than next to the Flag badge (the This week group) —
    // putting "OK" and "⚠ LARGE" side by side in the same cell read as a contradiction, when
    // they're actually answering two different questions about two different time windows.
    const threshold = state.unaccountedAlertThreshold ?? 50;
    const isLargeUnaccounted = Math.abs(r.unaccountedCost) >= threshold;
    tr.innerHTML = `
      <td class="left"><strong>${item.name}</strong><div class="info-note" style="margin:0">${item.unit==='gallon' ? item.pourOz+'oz pour' : ''}</div></td>
      <td><input type="text" data-f="purchased" value="${weekData[item.id].purchased}"></td>
      <td><input type="text" data-f="sold" value="${weekData[item.id].sold}"></td>
      <td><input type="text" data-f="discount" value="${weekData[item.id].discount}"></td>
      <td>${fmtN(r.comped)}</td>
      <td><input type="text" data-f="kitchen" value="${weekData[item.id].kitchen}"></td>
      <td>${fmtN(r.accountedFor)}</td>
      <td title="${r.pctAccounted.toFixed(0)}% exactly (${fmtN(r.accountedFor)} accounted for ÷ ${fmtN(r.purchU)} purchased this week)${(r.purchU>0 && r.accountedFor>r.purchU)?' — sold more than was purchased this week, using stock from before':''}">${(r.purchU>0 && r.accountedFor>r.purchU) ? '100%+' : r.pctAccounted.toFixed(0)+'%'}</td>
      <td><span class="flag ${r.flag}">${r.flag==='green'?'OK':r.flag==='yellow'?'WATCH':'FLAG'}</span>${sustained?'<span class="sustained">2+ wks</span>':''}</td>
      <td style="font-weight:700; color:${r.unaccounted>0?'var(--red)':'var(--ink)'}">${fmtN(r.unaccounted)}</td>
      <td style="${isLargeUnaccounted?'font-weight:700; color:#fb923c;':''}">${fmt$(r.unaccountedCost)}${isLargeUnaccounted?`<span class="flag alert-large" title="Running total unaccounted cost ${fmt$(r.unaccountedCost)} is at or above your $${threshold} alert threshold — this is the accumulated pile since period start, separate from This Week's Flag">⚠ Large</span>`:''}</td>
      <td><input type="text" data-f="actualCount" value="${weekData[item.id].actualCount}" placeholder="—"></td>
      <td class="left"><textarea class="note" data-f="notes">${weekData[item.id].notes}</textarea></td>
    `;
    tbody.appendChild(tr);

    // 'change' (fires on blur/Enter), not 'input' (fires per keystroke) — this table's handler
    // re-renders the whole page to recompute Accounted for/Unaccounted/Flag/Total, and doing that
    // on every keystroke destroys and rebuilds the very input you're mid-typing into, silently
    // dropping every character after the first (typing "49" only ever saved "4"). 'change' commits
    // once you leave the field, so the browser's native text input handles the typing untouched.
    tr.querySelectorAll('input, textarea').forEach(inp=>{
      inp.addEventListener('change', (e)=>{
        weekData[item.id][e.target.dataset.f] = e.target.value;
        save();
        renderStoreViewInPlace();
      });
    });
  });

  // total row — column order matches the header: Item, Purchased, [Sold/Discount/Comped/Kitchen
  // skipped], Accounted for, % of purchases, Flag, Unaccounted, Unacct. cost, [Count/Notes skipped]
  const pctTot = totPurchU>0 ? (totAccounted/totPurchU*100) : 0;
  const pctTotDisplay = (totPurchU>0 && totAccounted>totPurchU) ? '100%+' : pctTot.toFixed(0)+'%';
  const trTot = document.createElement('tr');
  trTot.className='total-row';
  trTot.innerHTML = `<td class="left">Total</td><td>${fmtN(totPurchU)}</td><td colspan="4"></td><td>${fmtN(totAccounted)}</td><td title="${pctTot.toFixed(0)}% exactly">${pctTotDisplay}</td><td></td><td style="color:var(--red)">${fmtN(totUnacctUnits)}</td><td>${fmt$(totUnacctCost)}</td><td colspan="2"></td>`;
  tbody.appendChild(trTot);

  table.appendChild(tbody);
  wcard.appendChild(table);
  // insertAdjacentHTML, not innerHTML +=: the latter re-serializes and reparses every existing
  // child of wcard (including the week tab buttons wired up above), which silently destroys the
  // click handlers wireClick just attached to them. This was the actual cause of week-switching
  // not working — not a browser quirk, a bug in this line.
  wcard.insertAdjacentHTML('beforeend', `<div class="info-note">*Comped = discount $ ÷ price, shown for reference only — it's already included in "Sold" and "Accounted for," not additive. †"This week" columns (including % of purchases and Flag) only look at what happened this week — this week's Purchased vs. this week's Accounted for — and ignore stock left over from prior weeks, so a slow week with 0 Purchased still shows 100%/green instead of a false alarm. "Running total" columns (Unaccounted, Unacct. cost) are the opposite: the full accumulated pile, including everything carried over since the period started. The two can disagree on purpose — a green Flag with a "⚠ Large" badge means this week's buying-and-selling looks fine, but there's still a real backlog of product sitting unaccounted for overall. Period Summary and the email export total each week's own This-Week flow, not this running balance. "Count" lets you log an actual physical cooler count for this week; entering it resets the running total used for next week's check.</div>`);
  app.appendChild(wcard);

  function renderStoreViewInPlace(){
    render();
  }

  // Period summary card
  renderPeriodSummary(app, store, period);
}

function renderPeriodSummary(app, store, period){
  const card = document.createElement('div');
  card.className='card';
  card.innerHTML = `<div class="rowflex"><h2>Period Summary — ${period.name}</h2>
    <button class="btn secondary small" id="copyEmailBtn">📋 Copy Email</button></div>`;

  let totUnacctCost=0, totUnacctUnits=0, totRetail=0, totPurchU=0, totAccounted=0;
  // Comp vs. revenue split: `comped` and `sold` here are the same fields computeRow already
  // derives (comped = discount$ / price, sold includes comped units rung into POS at $0/reduced).
  // grossPotential is what those sold units would have billed at full menu price; discSum is what
  // was actually given away. Deliberately two separate percentages, not one — comp rate (units)
  // and revenue realized (dollars) diverge on purpose, since a comped unit is a full unit but zero
  // revenue. See CHANGELOG for the Nick/Gary discussion this came out of.
  let totSold=0, totComp=0, totDisc=0, totGrossPotential=0;
  const perItem = store.items.filter(it=>!it.orderOnly).map(item=>{
    let pu=0, ac=0, ua=0, uc=0, soldSum=0, compSum=0, discSum=0;
    period.weeks.forEach(w=>{
      const r = computeRow(item, w);
      pu+=r.purchU; ac+=r.accountedFor; ua+=r.unaccounted; uc+=r.unaccountedCost;
      soldSum+=r.sold; compSum+=r.comped; discSum+=r.discount;
    });
    totUnacctCost+=uc; totUnacctUnits+=ua; totPurchU+=pu; totAccounted+=ac;
    totRetail += Math.max(ua,0)*item.price;
    const grossPotential = soldSum * item.price;
    totSold+=soldSum; totComp+=compSum; totDisc+=discSum; totGrossPotential+=grossPotential;
    const compRatePct = soldSum>0 ? (compSum/soldSum*100) : 0;
    const revenueRealizedPct = grossPotential>0 ? ((grossPotential-discSum)/grossPotential*100) : 0;
    return {item, pu, ac, ua, uc, soldSum, compSum, discSum, compRatePct, revenueRealizedPct};
  });
  const margin = totRetail - Math.max(totUnacctCost,0);
  const totCompRatePct = totSold>0 ? (totComp/totSold*100) : 0;
  const totRevenueRealizedPct = totGrossPotential>0 ? ((totGrossPotential-totDisc)/totGrossPotential*100) : 0;

  const kpis = document.createElement('div');
  kpis.className='kpi-grid';
  kpis.innerHTML = `
    <div class="kpi"><div class="label">Unaccounted units</div><div class="value red">${fmtN(totUnacctUnits)}</div></div>
    <div class="kpi"><div class="label">Unaccounted cost</div><div class="value red">${fmt$(totUnacctCost)}</div></div>
    <div class="kpi"><div class="label">Retail value if sold</div><div class="value">${fmt$(totRetail)}</div></div>
    <div class="kpi"><div class="label">Margin never captured</div><div class="value red">${fmt$(margin)}</div></div>
    <div class="kpi"><div class="label">% accounted, period</div><div class="value ${totPurchU>0 && totAccounted/totPurchU>=0.85 ? 'green':''}">${totPurchU>0?((totAccounted/totPurchU)*100).toFixed(0):'—'}%</div></div>
    <div class="kpi" title="Staff comp perk units ÷ total units sold, all channels. Comp $ backed out from discount $ ÷ menu price."><div class="label">Staff comp rate</div><div class="value">${totSold>0?totCompRatePct.toFixed(0):'—'}%</div></div>
    <div class="kpi" title="What was actually billed vs. what the same units would have billed at full menu price. The gap is the comp perk cost, not lost/unaccounted product."><div class="label">Revenue realized</div><div class="value ${totGrossPotential>0 && totRevenueRealizedPct>=90 ? 'green':''}">${totGrossPotential>0?totRevenueRealizedPct.toFixed(0):'—'}%</div></div>
  `;
  card.appendChild(kpis);

  const tbl = document.createElement('table');
  tbl.innerHTML = `<thead><tr><th class="left">Item</th><th>Purchased</th><th>Accounted</th><th>Unaccounted</th><th>% acct.</th><th>Cost</th><th title="Staff comp units ÷ total units sold this period">Comp %</th><th title="Billed $ ÷ full-price potential $ this period — the gap is the comp perk, not missing product">Revenue %</th></tr></thead>`;
  const tb = document.createElement('tbody');
  perItem.forEach(({item,pu,ac,ua,uc,soldSum,compRatePct,revenueRealizedPct})=>{
    const pct = pu>0 ? (ac/pu*100) : 0;
    const flag = pct<70?'red':pct<85?'yellow':'green';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="left">${item.name}</td><td>${fmtN(pu)}</td><td>${fmtN(ac)}</td><td>${fmtN(ua)}</td><td><span class="flag ${flag}">${pct.toFixed(0)}%</span></td><td>${fmt$(uc)}</td><td>${soldSum>0?compRatePct.toFixed(0)+'%':'—'}</td><td>${soldSum>0?revenueRealizedPct.toFixed(0)+'%':'—'}</td>`;
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  card.appendChild(tbl);
  app.appendChild(card);

  wireClick(card.querySelector('#copyEmailBtn'), ()=>{
    const text = generateEmail(store, period, perItem, totUnacctCost, totUnacctUnits, totRetail, margin, totPurchU, totAccounted);
    navigator.clipboard.writeText(text).then(()=>showToast('Email copied to clipboard')).catch(()=>{
      const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta); showToast('Email copied to clipboard');
    });
  });
}

function generateEmail(store, period, perItem, totUnacctCost, totUnacctUnits, totRetail, margin, totPurchU, totAccounted){
  const pct = totPurchU>0 ? (totAccounted/totPurchU*100) : 0;
  let lines = [];
  lines.push(`Subject: NA Beverage Purchase vs. Sales Variance — ${store.name} (${period.name}${period.startDate ? ', starting '+period.startDate : ''})`);
  lines.push('');
  lines.push('Team,');
  lines.push('');
  lines.push(`Purchasing vs. sales on NA Bev for the period, all channels included.`);
  lines.push('');
  perItem.sort((a,b)=>b.uc-a.uc).forEach(({item,pu,ac,ua,uc})=>{
    const p = pu>0 ? (ac/pu*100) : 0;
    lines.push(`${item.name} — Purchased: ${fmtN(pu)} | Accounted for: ${fmtN(ac)} | Unaccounted: ${fmtN(ua)} (${p.toFixed(0)}%) | Cost: ${fmt$(uc)}`);
  });
  lines.push('');
  lines.push(`Total — Unaccounted: ${fmtN(totUnacctUnits)} | Cost: ${fmt$(totUnacctCost)} | ${pct.toFixed(0)}% accounted for overall.`);
  lines.push('');
  lines.push(`"Accounted for" includes every channel and every employee comp — comped units are already rolled in, not on top of it.`);
  lines.push('');
  lines.push(`Bottom line: ${fmt$(totUnacctCost)} in product cost with no matching transaction. At menu price that's roughly ${fmt$(totRetail)} in sales, or ${fmt$(margin)} in gross margin never captured.`);
  lines.push('');
  lines.push(`This isn't about the employee meal comp perk — that stays as is. Just tightening up the numbers.`);
  lines.push('');
  lines.push('Next: spot-check vendor invoices, then a short physical cooler count on the flagged items.');
  lines.push('');
  lines.push('Nick');
  return lines.join('\n');
}

// ---------- Order Guide ----------
// Forward-looking decision support for whoever's placing NA Bev orders (Gary) — deliberately kept
// separate from the Variance view's job (retrospective: did what we bought show up as a sale).
// This view answers a different question: given usage so far, what should the next order be. It
// shares the same store/item config and the same period+week the Variance view is on, but reads
// its own `orders` log rather than writing to `weeks`.
function renderOrderGuide(app){
  const store = getActiveStore();
  if(store.items.length===0){
    const card = document.createElement('div');
    card.className='card empty-state';
    card.innerHTML = `<div>No items configured for <strong>${store.name}</strong> yet.</div>
      <button class="btn" id="goSettingsOG">Set up items in Settings</button>`;
    app.appendChild(card);
    wireClick(card.querySelector('#goSettingsOG'), ()=>{ state.activeView='settings'; save(); render(); });
    return;
  }
  ensureActivePeriod(store);
  const periodIdx = store._activePeriodIdx;
  const period = store.periods[periodIdx];
  const weekIdx = store._activeWeekIdx;

  const head = document.createElement('div');
  head.className = 'card';
  head.innerHTML = `<div class="rowflex">
    <div>
      <h2 style="margin-bottom:2px">Order Guide — ${store.name}</h2>
      <div class="info-note" style="margin:0">${period.name}, Week ${weekIdx+1}${period.startDate?' · starting '+period.startDate:''}. Order windows below are real vendor cadence (Shamrock 3x/wk, Passport weekly), not tied to this week boundary the way the Variance view is — use the selector just to pick which week's orders you're logging.</div>
    </div>
    <select id="ogWeekSelect"></select>
  </div>`;
  app.appendChild(head);
  const wsel = head.querySelector('#ogWeekSelect');
  [0,1,2,3].forEach(i=>{
    const o=document.createElement('option'); o.value=i; o.textContent='Week '+(i+1); if(i===weekIdx) o.selected=true;
    wsel.appendChild(o);
  });
  wsel.onchange = ()=>{ store._activeWeekIdx = parseInt(wsel.value); save(); render(); };

  const orderData = period.orders[weekIdx];

  // Group items by vendor, in the order vendors first appear in store.items (Shamrock, then
  // Passport, matching Gary's sheet), so each vendor gets its own table with its own order-window
  // columns — one submission per vendor is how he actually places these.
  const vendors = [];
  store.items.forEach(it=>{
    const v = it.vendor || '(no vendor)';
    if(!vendors.includes(v)) vendors.push(v);
  });

  vendors.forEach(vendor=>{
    const items = store.items.filter(it=>(it.vendor||'(no vendor)')===vendor);
    const slots = slotsForVendor(vendor==='(no vendor)' ? '' : vendor);

    const card = document.createElement('div');
    card.className = 'card';
    let html = `<h2 style="margin-bottom:10px">${vendor}</h2>`;
    html += `<table><thead><tr>
      <th class="left">Item</th>
      <th class="left">Size</th>
      <th>Unit price</th>
      <th>Avg wk usage*</th>
      <th>Par target</th>
      <th>Est. on-hand†</th>
      <th>Suggested (wk)</th>`;
    slots.forEach(label=>{ html += `<th class="left">${label}</th>`; });
    html += `</tr></thead><tbody>`;
    card.innerHTML = html;
    const tbody = document.createElement('tbody');

    items.forEach(item=>{
      const unitLabel = item.unit==='gallon' ? 'gal' : item.unit==='lb' ? 'lb' : item.unit==='case' ? 'case' : 'units';
      let avgUsage=null, parTarget=null, onHand=null, suggestedNative=null;
      if(!item.orderOnly){
        avgUsage = trailingAvgUsage(store, item, periodIdx, weekIdx);
        const mult = item.parMultiplier ?? 1.3;
        parTarget = avgUsage===null ? null : avgUsage * mult;
        // Through-and-including this week, not just entering it — the freshest running balance
        // available, reflecting whatever's been imported/entered for this week so far. This is a
        // whole-week figure; with real sales data only arriving at weekly granularity, splitting
        // it further across Shamrock's 3 order windows would be false precision, so "Suggested"
        // stays a per-week guide even though logging below is per order window.
        onHand = expectedOnHand(store, period, item, weekIdx);
        const suggestedServings = parTarget===null ? null : Math.max(0, parTarget - onHand);
        suggestedNative = suggestedServings===null ? null : servingsToNative(item, suggestedServings);
      }
      const last = lastOrder(store, periodIdx, weekIdx, item);

      const tr = document.createElement('tr');
      let rowHtml = `
        <td class="left"><strong>${item.name}</strong>${last ? `<div class="info-note" style="margin:0">Last: ${fmtN(last.qty)} ${unitLabel} · ${last.date||'no date'} (${last.label})</div>` : ''}</td>
        <td class="left">${item.sizeLabel||''}</td>
        <td>${item.cost ? fmt$(item.cost) : '—'}</td>
        <td>${avgUsage===null ? '—' : fmtN(avgUsage)+' svg'}</td>
        <td>${parTarget===null ? '—' : fmtN(parTarget)+' svg'}</td>
        <td>${onHand===null ? '—' : fmtN(servingsToNative(item, onHand))+' '+unitLabel}</td>
        <td style="font-weight:700; color:${suggestedNative ? 'var(--teal)':'var(--ink)'}">${suggestedNative===null?'—':fmtN(suggestedNative)+' '+unitLabel}</td>
      `;
      const arr = orderData[item.id] || [];
      slots.forEach((label, s)=>{
        const entry = arr[s] || {qty:'', date:''};
        rowHtml += `<td class="left"><input type="text" style="width:52px" data-slot="${s}" data-f="qty" value="${entry.qty}" placeholder="qty">
          <input type="text" style="width:88px" data-slot="${s}" data-f="date" value="${entry.date}" placeholder="date"></td>`;
      });
      tr.innerHTML = rowHtml;
      tbody.appendChild(tr);
      tr.querySelectorAll('input').forEach(inp=>{
        inp.addEventListener('input', (e)=>{
          const s = parseInt(e.target.dataset.slot);
          if(!Array.isArray(orderData[item.id])) orderData[item.id] = slots.map(()=>({qty:'',date:''}));
          if(!orderData[item.id][s]) orderData[item.id][s] = {qty:'', date:''};
          orderData[item.id][s][e.target.dataset.f] = e.target.value;
          save();
        });
      });
    });

    const table = card.querySelector('table');
    table.appendChild(tbody);
    app.appendChild(card);
  });

  const noteCard = document.createElement('div');
  noteCard.className = 'card';
  noteCard.insertAdjacentHTML('beforeend', `<div class="info-note">*Avg wk usage = trailing average of Sold + Kitchen use over the last up to 4 weeks with real data entered, spanning back across prior periods if needed. Order-only items (no sales data, e.g. Passport coffee/tea) always show "—" here — nothing to base a suggestion on. †Est. on-hand = beginning inventory rolled forward through purchased-vs-accounted flow (same running balance as the Variance view), as of whatever's been imported/entered so far this week. Suggested = Par target (avg usage × per-item multiplier, set in Settings) − Est. on-hand, floored at zero — a whole-week guide, not split per order window. Log actual order qty/date per window below; it becomes "Last order" the next time you view this item.</div>`);
  app.appendChild(noteCard);
}

// ---------- Compare view ----------
// Was "Cross-Store Comparison" (one row per store, each store's latest period) back when there
// were multiple stores. With only Central Phoenix left, comparing stores would collapse to a
// single row — not useful. Repurposed to compare periods instead: one row per period for this
// store, so you can see whether % accounted / unaccounted cost are trending in the right
// direction period over period, which nothing else in the app currently shows (Period Summary
// only ever shows one period at a time).
function renderCompare(app){
  const store = getActiveStore();
  const card = document.createElement('div');
  card.className='card';
  card.innerHTML = `<h2>Compare Periods — ${store.name}</h2><div class="info-note" style="margin-bottom:10px">Each period's totals side by side, oldest to newest, so you can see whether things are trending in the right direction.</div>`;

  const rows = [];
  if(store.items.length>0){
    store.periods.forEach(period=>{
      let totPurchU=0, totAccounted=0, totUnacctCost=0;
      let worst = null;
      store.items.filter(it=>!it.orderOnly).forEach(item=>{
        let pu=0, ac=0, uc=0;
        period.weeks.forEach(w=>{ const r=computeRow(item,w); pu+=r.purchU; ac+=r.accountedFor; uc+=r.unaccountedCost; });
        totPurchU+=pu; totAccounted+=ac; totUnacctCost+=uc;
        const pct = pu>0 ? ac/pu*100 : 100;
        if(!worst || pct < worst.pct) worst = {name:item.name, pct};
      });
      const pctAcct = totPurchU>0 ? (totAccounted/totPurchU*100) : null;
      rows.push({name: period.name, startDate: period.startDate, pctAcct, totUnacctCost, worst});
    });
  }

  if(rows.length===0){
    card.insertAdjacentHTML('beforeend', `<div class="empty-state">No periods yet.</div>`);
    app.appendChild(card);
    return;
  }

  const tbl = document.createElement('table');
  tbl.innerHTML = `<thead><tr><th class="left">Period</th><th class="left">Start date</th><th>% accounted</th><th>Unaccounted cost</th><th class="left">Worst item</th></tr></thead>`;
  const tb = document.createElement('tbody');
  rows.forEach(r=>{
    const flag = r.pctAcct===null ? '' : r.pctAcct<70?'red':r.pctAcct<85?'yellow':'green';
    tb.appendChild(Object.assign(document.createElement('tr'), {innerHTML:
      `<td class="left">${r.name}</td><td class="left">${r.startDate||'—'}</td>
       <td>${r.pctAcct===null?'—':'<span class="flag '+flag+'">'+r.pctAcct.toFixed(0)+'%</span>'}</td>
       <td>${fmt$(r.totUnacctCost)}</td>
       <td class="left">${r.worst ? r.worst.name+' ('+r.worst.pct.toFixed(0)+'%)' : '—'}</td>`
    }));
  });
  tbl.appendChild(tb);
  card.appendChild(tbl);

  const chartWrap = document.createElement('div');
  chartWrap.className='compare-bar-wrap';
  const canvas = document.createElement('canvas');
  chartWrap.appendChild(canvas);
  card.appendChild(chartWrap);
  app.appendChild(card);

  new Chart(canvas, {
    type:'bar',
    data:{
      labels: rows.map(r=>r.name),
      datasets:[{ label:'Unaccounted cost ($)', data: rows.map(r=>Math.round(r.totUnacctCost*100)/100),
        backgroundColor:'#2dd4bf', borderRadius:6 }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ ticks:{color:'#8996a5'}, grid:{color:'rgba(255,255,255,.05)'} },
        y:{ ticks:{color:'#8996a5'}, grid:{color:'rgba(255,255,255,.05)'} }
      }
    }
  });
}

// ---------- Settings ----------
function renderSettings(app){
  const alertCard = document.createElement('div');
  alertCard.className = 'card';
  alertCard.innerHTML = `<h3>Alerts</h3>
    <div class="info-note" style="margin-bottom:8px">The weekly Flag (OK/WATCH/FLAG) only checks this week's purchased-vs-sold ratio — a large pile of unaccounted product can otherwise sit there indefinitely without tripping it, as long as purchasing keeps roughly pace with sales each week. This is a second, independent check: any week where an item's unaccounted <em>cost</em> is at or above this dollar amount gets a separate "⚠ LARGE" badge, regardless of what the weekly Flag says.</div>
    <div class="settings-field"><label>Unaccounted $ alert threshold</label><input type="text" id="alertThreshold" value="${state.unaccountedAlertThreshold ?? 50}" style="width:90px"></div>`;
  app.appendChild(alertCard);
  alertCard.querySelector('#alertThreshold').addEventListener('change', (e)=>{
    const v = parseFloat(e.target.value);
    state.unaccountedAlertThreshold = isNaN(v) ? 50 : v;
    save(); render();
  });

  Object.keys(state.stores).forEach(key=>{
    const store = state.stores[key];
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML = `<div class="rowflex"><h2>${store.name}</h2><button class="btn small secondary" data-add="${key}">+ Add item</button></div>`;
    const list = document.createElement('div');
    store.items.forEach((item, idx)=>{
      const row = document.createElement('div');
      row.className='settings-item';
      row.innerHTML = `
        <div class="settings-field"><label>Name</label><input type="text" class="wide" data-k="name" value="${item.name}"></div>
        <div class="settings-field"><label>Unit</label>
          <select data-k="unit">
            <option value="can" ${item.unit==='can'?'selected':''}>can/unit</option>
            <option value="gallon" ${item.unit==='gallon'?'selected':''}>gallon</option>
          </select>
        </div>
        <div class="settings-field"><label>Price ($)</label><input type="text" data-k="price" value="${item.price}"></div>
        <div class="settings-field"><label>Cost ($)</label><input type="text" data-k="cost" value="${item.cost}"></div>
        <div class="settings-field"><label>Pour oz (gallon items)</label><input type="text" data-k="pourOz" value="${item.pourOz ?? ''}"></div>
        <div class="settings-field"><label>Default kitchen use/wk</label><input type="text" data-k="defaultKitchen" value="${item.defaultKitchen ?? 0}"></div>
        <div class="settings-field"><label>Par multiplier</label><input type="text" data-k="parMultiplier" value="${item.parMultiplier ?? 1.3}"></div>
        <div class="settings-field"><label>Vendor</label><input type="text" data-k="vendor" value="${item.vendor ?? ''}" placeholder="e.g. Shamrock"></div>
        <div class="settings-field"><label>Size (Order Guide)</label><input type="text" data-k="sizeLabel" value="${item.sizeLabel ?? ''}" placeholder="e.g. 12 oz (24/cs)"></div>
        <div class="settings-field"><label>Order-only (no sales data)</label>
          <select data-k="orderOnly">
            <option value="false" ${!item.orderOnly?'selected':''}>No</option>
            <option value="true" ${item.orderOnly?'selected':''}>Yes</option>
          </select>
        </div>
        <button class="btn danger small" data-remove="${idx}">Remove</button>
      `;
      row.querySelectorAll('input,select').forEach(inp=>{
        inp.addEventListener('change', (e)=>{
          const k = e.target.dataset.k;
          let v = e.target.value;
          if(['price','cost','pourOz','defaultKitchen','parMultiplier'].includes(k)) v = v===''? null : parseFloat(v);
          if(k==='orderOnly') v = v==='true';
          const vendorChanged = k==='vendor' && v!==item.vendor;
          item[k]=v;
          if(vendorChanged){
            // Order-window slot count depends on vendor — resize every existing orders entry for
            // this item so the UI and data stay in sync (migrateOrders would also catch this on
            // next reload, but doing it now means it's correct immediately, no refresh needed).
            store.periods.forEach(p=>{
              if(!Array.isArray(p.orders)) return;
              p.orders.forEach(o=>{
                const nSlots = slotsForVendor(item.vendor).length;
                let cur = Array.isArray(o[item.id]) ? o[item.id] : [];
                while(cur.length < nSlots) cur.push({qty:'', date:''});
                if(cur.length > nSlots) cur = cur.slice(0, nSlots);
                o[item.id] = cur;
              });
            });
          }
          save();
        });
      });
      wireClick(row.querySelector('[data-remove]'), ()=>{
        store.items.splice(idx,1); save(); render();
      });
      list.appendChild(row);
    });
    card.appendChild(list);
    wireClick(card.querySelector('[data-add]'), ()=>{
      const newItem = {id:'item'+Date.now(), name:'New Item', unit:'can', price:0, cost:0, pourOz:null, defaultKitchen:0, kitchenNote:'', parMultiplier:1.3, vendor:'', sizeLabel:'', orderOnly:false};
      store.items.push(newItem);
      store.periods.forEach(p=>{
        p.weeks.forEach(w=>{ w[newItem.id] = {purchased:0,sold:0,discount:0,kitchen:0,notes:'',actualCount:''}; });
        if(Array.isArray(p.orders)) p.orders.forEach(o=>{ o[newItem.id] = slotsForVendor(newItem.vendor).map(()=>({qty:'', date:''})); });
      });
      save(); render();
    });
    app.appendChild(card);
  });

  const resetCard = document.createElement('div');
  resetCard.className='card';
  resetCard.innerHTML = `<h3>Reset</h3><div class="info-note" style="margin-bottom:8px">Clears all tracked data for every store. Item configuration is kept.</div>
    <button class="btn danger small" id="resetData">Clear all weekly data</button>`;
  wireClick(resetCard.querySelector('#resetData'), ()=>{
    if(confirm('Clear all weekly/period data for every store? Item settings will be kept.')){
      Object.values(state.stores).forEach(s=>{ s.periods=[]; s._activePeriodIdx=undefined; s._activeWeekIdx=undefined; });
      save(); render();
    }
  });
  app.appendChild(resetCard);
}

// Safety net: without this, dropping a file anywhere on the page outside an active dropzone
// makes the browser navigate away to display the raw file instead of doing nothing.
window.addEventListener('dragover', (e)=> e.preventDefault());
window.addEventListener('drop', (e)=> e.preventDefault());

// Single delegated click listener backing every wireClick() button (see wireClick above). This
// listener is attached once, to `document`, and never gets removed/recreated — unlike the
// buttons themselves, which are torn down and rebuilt on every render(). Delegating from a
// stable, permanent element is what makes clicks reliably register.
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-clickable]');
  if(el && typeof el.__clickHandler === 'function') el.__clickHandler(e);
});

render();
</script>
</body>
</html>
